name=edge_ml
version=0.2.0
author=CIJE Curriculum
maintainer=CIJE Curriculum
sentence=DFR1154 (ESP32-S3 AI CAM) camera helpers, dashboard, cloud AI review, and Edge ML hook.
paragraph=Provides DFRobot DFR1154 pin map and camera init matching firmware v3.2.5, optional /stream and /capture handlers for aiming, sqdet_servo (PCA9685, GPIO, or UART/ACEBOTT), a dataset+dashboard for human-in-the-loop labeling, an on-device OpenAI/Anthropic vision "AI squirrel review" pipeline, and a stub edge_ml_api ready for Edge Impulse integration. See firmware/edge_ml/README.md.
category=Other
url=https://github.com/
architectures=esp32
includes=dfr1154_camera.h
depends=ArduinoJson (>=6.19.0)
# Adafruit PWM Servo Driver: needed on ACEBOTT sketch, or camera if EDGE_ML_SERVO_ENABLE_PCA9685
# Arduino Servo: only if EDGE_ML_SERVO_ENABLE_GPIO (avoid with ESP32 core 3.x)
# ArduinoJson (bblanchon): used by cloud_ml_api.cpp to parse OpenAI/Anthropic vision responses.
# Written against the ArduinoJson 6.x API (DynamicJsonDocument); if Library Manager
# installs 7.x, either pin to a 6.x release or port cloud_ml_api.cpp to the v7 JsonDocument API.
